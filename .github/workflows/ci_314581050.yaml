name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  ci:
    name: Typecheck, Format Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: |
          mkdir -p test-results
          npm test -- \
            --reporter=default \
            --reporter=junit \
            --reporter=json \
            --outputFile.junit=test-results/junit.xml \

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false
