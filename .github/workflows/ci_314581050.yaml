name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  ci:
    name: Typecheck, Format Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: |
          mkdir -p test-results
          npm test -- \
            --reporter=default \
            --reporter=junit \
            --reporter=json \
            --outputFile.junit=test-results/junit.xml \
            --outputFile.json=test-results/results.json

      - name: Show test details on Actions page
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f test-results/results.json ]; then
            node - <<'EOF' >> $GITHUB_STEP_SUMMARY
          const fs = require('fs');

          const data = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));

          console.log(`- Total tests: ${data.numTotalTests}`);
          console.log(`- Passed: ${data.numPassedTests}`);
          console.log(`- Failed: ${data.numFailedTests}`);
          console.log("");

          console.log("### Test Cases");
          console.log("");

          for (const file of data.testResults || []) {
            console.log(`#### ${file.name}`);
            console.log("");

            for (const test of file.assertionResults || []) {
              const icon = test.status === "passed" ? "✅" : "❌";
              console.log(`- ${icon} ${test.fullName}`);
            }

            console.log("");
          }
          EOF
          else
            echo "No test result file found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false
